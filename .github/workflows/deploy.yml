name: 🚀 Deploy Bot

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.html'
      - '*.css'
      - '*.js'
      - 'README.md'

concurrency:
  group: bot-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🔧 Create .env
      run: |
        echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" >> .env
        echo "ADMIN_ID=${{ secrets.ADMIN_ID }}" >> .env
        echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" >> .env
    
    - name: 📥 Restore database (if exists)
      run: |
        if [ -f "logs.db" ]; then
          echo "✅ logs.db found, restoring..."
        else
          echo "📄 logs.db not found, will create new"
        fi
    
    - name: 🤖 Run bot
      run: python bot.py
    
    - name: 📤 Upload database as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bot-database
        path: |
          logs.db
          logs.json
        retention-days: 7
