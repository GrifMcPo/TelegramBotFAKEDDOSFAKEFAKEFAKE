name: 🚀 Deploy Bot

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.html'
      - '*.css'
      - '*.js'

concurrency:
  group: bot-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🔧 Create .env
      run: |
        echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" >> .env
        echo "ADMIN_ID=${{ secrets.ADMIN_ID }}" >> .env
        echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" >> .env
    
    - name: 📥 Restore data
      run: |
        if curl -s -o logs.json "https://raw.githubusercontent.com/GrifMcPo/TelegramBotFAKEDDOSFAKEFAKEFAKE/main/logs.json"; then
          echo "✅ logs.json загружен"
        else
          echo "[]" > logs.json
        fi
        if curl -s -o blacklist.json "https://raw.githubusercontent.com/GrifMcPo/TelegramBotFAKEDDOSFAKEFAKEFAKE/main/blacklist.json"; then
          echo "✅ blacklist.json загружен"
        else
          echo "{}" > blacklist.json
        fi
    
    - name: 🤖 Run bot
      run: python bot.py
    
    - name: 📤 Save data
      if: always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add logs.json blacklist.json 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "📊 Update data $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push
        else
          echo "✅ Нет изменений"
        fi
