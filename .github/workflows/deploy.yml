name: 🚀 Deploy Bot

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🔧 Create .env
      run: |
        echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" >> .env
    
    - name: 🤖 Run bot
      run: python bot.py
    
    - name: 📤 Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bot-data
        path: |
          logs.db
          logs.json
        retention-days: 7
