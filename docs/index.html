<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot Control Room</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="shell"><header><div><span class="eyebrow">TELEGRAM BOT / CONTROL ROOM</span><h1>Управление ботом</h1><p>Команда проходит через Supabase и выполняется worker-ом бота.</p></div><span class="status"><i></i> очередь онлайн</span></header><section class="card"><label for="command">Команда</label><div class="command-row"><input id="command" placeholder="/stats, /ban 123 60 причина" autocomplete="off"><button id="send">Выполнить ↗</button></div><div class="quick"><button data-command="/stats">/stats</button><button data-command="/idlist">/idlist</button><button data-command="/help">/help</button><button data-command="/ping">/ping</button></div></section><section class="card"><div class="section-title"><div><span class="eyebrow">LAST RESPONSE</span><h2>Ответ бота</h2></div><span id="state" class="muted">Ожидание команды</span></div><pre id="result">Здесь появится результат выполнения.</pre></section><footer>Прямой Telegram API на сайте не используется · ключ в браузере только anon/public</footer></main><script src="script.js"></script></body></html>
