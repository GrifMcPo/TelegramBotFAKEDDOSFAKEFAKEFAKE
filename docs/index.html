<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN PANEL — Логи бота</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========== ВХОД ========== -->
    <div id="loginPage" class="login-page">
        <div class="login-container">
            <div class="login-header">
                <h1>⚡ ADMIN PANEL</h1>
                <p>Панель управления ботом</p>
            </div>
            <div class="login-box">
                <div class="login-title">🔑 ВВЕДИТЕ КЛЮЧ ДОСТУПА</div>
                <div class="login-input-group">
                    <input type="password" id="keyInput" placeholder="Введите ключ..." autofocus>
                    <button id="loginBtn">ВОЙТИ</button>
                </div>
                <div id="loginError" class="login-error">❌ Неверный ключ!</div>
            </div>
        </div>
        <div class="rgb-bg"></div>
    </div>

    <!-- ========== ГЛАВНАЯ ========== -->
    <div id="mainPage" class="main-page" style="display: none;">
        
        <header>
            <div class="header-container">
                <div class="header-logo"><span>⚡</span><h1>ADMIN PANEL</h1></div>
                <div class="header-user">
                    <span>👤 Администратор</span>
                    <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
                </div>
            </div>
        </header>

        <nav class="nav-tabs">
            <div class="container">
                <button class="nav-btn active" data-tab="logs">📋 Логи</button>
                <button class="nav-btn" data-tab="chats">💬 Чаты</button>
                <button class="nav-btn" data-tab="stats">📊 Статистика</button>
            </div>
        </nav>

        <!-- ===== ЛОГИ ===== -->
        <section id="tab-logs" class="tab-content active">
            <div class="container">
                <div class="log-controls">
                    <input type="text" id="searchLogs" placeholder="🔍 Поиск по командам..." oninput="filterLogs()">
                    <button onclick="loadData()" class="btn-refresh">🔄 Обновить</button>
                </div>
                <div class="logs-container" id="logsContainer">
                    <div class="loading-text">⏳ Загрузка логов...</div>
                </div>
            </div>
        </section>

        <!-- ===== ЧАТЫ ===== -->
        <section id="tab-chats" class="tab-content">
            <div class="container">
                <h2>💬 ЧАТЫ</h2>
                <div class="chats-grid" id="chatsContainer">
                    <div class="loading-text">⏳ Загрузка чатов...</div>
                </div>
            </div>
        </section>

        <!-- ===== СТАТИСТИКА ===== -->
        <section id="tab-stats" class="tab-content">
            <div class="container">
                <h2>📊 СТАТИСТИКА</h2>
                <div class="stats-grid" id="statsContainer">
                    <div class="stat-card"><div class="stat-number" id="statUsers">0</div><div class="stat-label">👤 Пользователей</div></div>
                    <div class="stat-card"><div class="stat-number" id="statCommands">0</div><div class="stat-label">📝 Команд</div></div>
                    <div class="stat-card"><div class="stat-number" id="statProbes">0</div><div class="stat-label">🔍 Пробивов</div></div>
                    <div class="stat-card"><div class="stat-number" id="statTime">0</div><div class="stat-label">🕐 Последнее обновление</div></div>
                </div>
            </div>
        </section>

        <footer>
            <div class="container">
                <p>© 2026 ADMIN PANEL</p>
            </div>
        </footer>
    </div>

    <!-- ========== МОДАЛКА ========== -->
    <div id="chatModal" class="chat-modal">
        <div class="chat-modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">💬 Чат с пользователем</h2>
                <button class="modal-close" onclick="closeChat()">✕</button>
            </div>
            <div id="modalMessages"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
