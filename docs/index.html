<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>RCON Web Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <h1>🤖 Telegram Bot RCON</h1>
        <p style="text-align: center; color: #64748b;">Отправляйте команды через сайт. Ответы придут из Telegram.</p>
        
        <div id="console" class="terminal"></div>
        
        <div class="input-group">
            <input type="text" id="cmdInput" placeholder="/stats | .whois ip 8.8.8.8" autocomplete="off">
            <button id="sendBtn">EXECUTE</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
